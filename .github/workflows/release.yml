name: release

# Tag-triggered release. A tag of v* produces a release with the artefacts
# the project ships, and the changelog section for that version becomes the
# release body.

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'

      - name: Test
        run: python3 -m unittest discover -s tests -v

      - name: Compile
        run: python3 -m compileall -q src scripts

      - name: Extract the version
        id: version
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Building $VERSION"

      - name: Build
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          mkdir -p dist
          git archive --format=tar.gz --prefix="agent-orchestrator-${VERSION}/" -o "dist/agent-orchestrator-${VERSION}.tar.gz" HEAD
          awk -v version="$VERSION" '
            index($0, "## [" version "]") == 1 { in_version=1; next }
            in_version && /^## / { exit }
            in_version { print }
          ' CHANGELOG.md > dist/RELEASE_NOTES.md
          test -s dist/RELEASE_NOTES.md

      - name: Publish
        uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3.0.4
        with:
          files: dist/agent-orchestrator-${{ steps.version.outputs.version }}.tar.gz
          body_path: dist/RELEASE_NOTES.md
